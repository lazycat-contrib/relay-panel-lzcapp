version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/relay-panel.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: panel

build:
  toolchains: []
  run_buildscript: false

images:
  - id: panel
    target: service
    service: panel
    source: ghcr.io/moeshinx/relay-panel-panel
    channel: stable
    delivery:
      mode: mirror
      image_template: ghcr.1ms.run/moeshinx/relay-panel-panel:{tag}
      require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: RelayPanel
    summary: "RelayPanel LazyCat package published from GitHub Actions"
